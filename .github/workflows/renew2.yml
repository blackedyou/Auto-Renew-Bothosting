name: Auto Renew Bot-hosting 2

on:
  schedule:
    - cron: '0 8 * * *' # 每天UTC 8点 (北京时间16点, 一般都会推迟),自行根据服务到期时间调整
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录（仅删除失败的，保留所有成功）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "开始清理失败的工作流运行记录..."
          # 获取所有运行记录（包含 status 和 conclusion）
          runs=$(gh run list --workflow=renew2.yml --limit=100 --json databaseId,conclusion,status --jq '.[] | "\(.databaseId) \(.conclusion) \(.status)"')
          
          deleted=0
          kept=0
          
          while read -r run_id conclusion status; do
            # 跳过正在运行的
            if [ "$status" = "in_progress" ] || [ "$status" = "queued" ]; then
              echo "跳过进行中的运行: $run_id"
              continue
            fi
            
            # 只保留成功的（conclusion == success），其他全部删除
            if [ "$conclusion" = "success" ]; then
              echo "✅ 保留成功的运行: $run_id"
              kept=$((kept + 1))
            else
              echo "🗑️ 删除失败/取消的运行: $run_id (conclusion=$conclusion)"
              gh run delete "$run_id" || true
              deleted=$((deleted + 1))
            fi
          done <<< "$runs"
          
          echo "清理完成：保留成功 $kept 个，删除失败 $deleted 个"
