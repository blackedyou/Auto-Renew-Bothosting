name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时执行一次（UTC 0、6、12、18点）
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录（保留所有成功 + 最近一次失败）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "开始清理工作流运行记录..."
          runs=$(gh run list --workflow=renew.yml --limit=100 --json databaseId,conclusion,status --jq '.[] | "\(.databaseId) \(.conclusion) \(.status)"')
          
          kept_success=0
          kept_failed=0
          deleted=0
          has_kept_failed=false
          
          while read -r run_id conclusion status; do
            if [ "$status" = "in_progress" ] || [ "$status" = "queued" ]; then
              echo "跳过进行中的运行: $run_id"
              continue
            fi
            
            if [ "$conclusion" = "success" ]; then
              echo "✅ 保留成功的运行: $run_id"
              kept_success=$((kept_success + 1))
            else
              if [ "$has_kept_failed" = false ]; then
                echo "⚠️ 保留最近一次失败的运行: $run_id (conclusion=$conclusion)"
                kept_failed=$((kept_failed + 1))
                has_kept_failed=true
              else
                echo "🗑️ 删除旧的失败运行: $run_id (conclusion=$conclusion)"
                gh run delete "$run_id" || true
                deleted=$((deleted + 1))
              fi
            fi
          done <<< "$runs"
          
          echo "清理完成：保留成功 $kept_success 个，保留最近失败 $kept_failed 个，删除旧失败 $deleted 个"
